<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pemutar Media Kuliah Responsif</title>

    <link rel="stylesheet" href="03-tugas-style.css">
</head>

<body>

    <main>
        <article class="media-card">

    <picture class="media-card__picture">
        <source
            media="(min-width: 768px)"
            srcset="https://images.unsplash.com/photo-1516321318423-f06f85e504b3?w=1200&fm=webp">

        <source
            media="(max-width: 767px)"
            srcset="https://images.unsplash.com/photo-1516321318423-f06f85e504b3?w=640&fm=webp">

        <img
            class="media-card__image"
            src="https://images.unsplash.com/photo-1516321318423-f06f85e504b3?w=800"
            alt="Mahasiswa belajar menggunakan laptop">
    </picture>

    <h1 class="media-card__title">
        Dasar-Dasar Pemrograman Web
    </h1>

</article>
    </main>

</body>
</html>
