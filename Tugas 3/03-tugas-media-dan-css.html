<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pemutar Media Kuliah Responsif</title>

    <link rel="stylesheet" href="03-tugas-style.css">
</head>

<body>

    <main>
        <article class="media-card media-card--featured">

    <picture class="media-card__picture">
        <source
            media="(min-width: 768px)"
            srcset="https://images.unsplash.com/photo-1516321318423-f06f85e504b3?w=1200&fm=webp">

        <source
            media="(max-width: 767px)"
            srcset="https://images.unsplash.com/photo-1516321318423-f06f85e504b3?w=640&fm=webp">

        <img
            class="media-card__image"
            src="https://images.unsplash.com/photo-1516321318423-f06f85e504b3?w=800"
            alt="Mahasiswa belajar menggunakan laptop">
    </picture>

    <h1 class="media-card__title">
        Dasar-Dasar Pemrograman Web
    </h1>

    <div class="media-card__video-wrapper">

    <video
        class="media-card__video"
        controls
        preload="metadata"
        poster="https://images.unsplash.com/photo-1498050108023-c5249f4df085?w=1000&fm=webp">

        <source
            src="https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.webm"
            type="video/webm">

        <source
            src="https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4"
            type="video/mp4">

        Browser Anda tidak mendukung pemutar video.

    </video>

</div>

<div class="media-card__audio-section">

    <h2 class="media-card__subtitle">
        Audio Materi
    </h2>

    <audio class="media-card__audio" controls>

        <source
            src="https://interactive-examples.mdn.mozilla.net/media/cc0-audio/t-rex-roar.mp3"
            type="audio/mpeg">

        Browser Anda tidak mendukung pemutar audio.

    </audio>

</div>

<div class="media-card__content">

    <p class="media-card__description">
        Materi ini membahas dasar-dasar pemrograman web,
        penggunaan elemen multimedia HTML5, gambar responsif,
        serta penerapan CSS untuk menghasilkan antarmuka yang
        nyaman digunakan pada berbagai ukuran layar.
    </p>

</div>

</article>
    </main>

</body>
</html>
